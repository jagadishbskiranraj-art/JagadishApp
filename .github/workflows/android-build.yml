name: Android APK Build

on:
  workflow_dispatch: # ಇದರಿಂದ ನೀವು ಮ್ಯಾನ್ಯುಯಲ್ ಆಗಿ ಬಿಲ್ಡ್ ರನ್ ಮಾಡಬಹುದು

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev lld libffi-dev libssl-dev autoconf automake libtool pkg-config zlib1g-dev
        pip install --upgrade pip
        pip install buildozer cython virtualenv

    - name: Accept Android Licenses
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        yes | sdkmanager --licenses || true

    - name: Build with Buildozer
      run: |
        # ಒಂದು ವೇಳೆ buildozer.spec ಫೈಲ್ ಇಲ್ಲದಿದ್ದರೆ ಹೊಸದಾಗಿ ಕ್ರಿಯೇಟ್ ಮಾಡುತ್ತದೆ
        if [ ! -f buildozer.spec ]; then
          buildozer init
          # ಇಲ್ಲಿ ನಿಮ್ಮ ಆಪ್ ಹೆಸರನ್ನು JagadishArk ಎಂದು ಬದಲಾಯಿಸಲಾಗುತ್ತದೆ
          sed -i 's/title = My Application/title = JagadishArk/' buildozer.spec
          sed -i 's/package.name = myapp/package.name = jagadishark/' buildozer.spec
        fi
        
        # APK ಬಿಲ್ಡ್ ಪ್ರಕ್ರಿಯೆ ಪ್ರಾರಂಭ
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: JagadishArk-Android-APK
        path: bin/*.apk
