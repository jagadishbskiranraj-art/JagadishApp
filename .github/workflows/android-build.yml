name: Android APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev lld libffi-dev libssl-dev autoconf automake libtool pkg-config zlib1g-dev openjdk-17-jdk python3-pip ant
        pip install --upgrade pip
        pip install buildozer cython virtualenv

    - name: Pre-setup Android SDK Manager
      run: |
        # ಗಿಟ್‌ಹಬ್ ರನ್ನರ್‌ನಲ್ಲಿರುವ ಡಿಫಾಲ್ಟ್ ಕಮಾಂಡ್ ಲೈನ್ ಪರಿಕರಗಳನ್ನು ಲಿಂಕ್ ಮಾಡುವುದು
        sudo ln -sf /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager /usr/local/bin/sdkmanager || true
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        yes | sdkmanager --licenses || true

    - name: Build with Buildozer
      run: |
        if [ ! -f buildozer.spec ]; then
          buildozer init
          sed -i 's/title = My Application/title = JagadishArk/' buildozer.spec
          sed -i 's/package.name = myapp/package.name = jagadishark/' buildozer.spec
          sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
        fi
        # ಬಿಲ್ಡೋಜರ್ ಕಡ್ಡಾಯವಾಗಿ ಗಿಟ್‌ಹಬ್‌ನ ಆಂಡ್ರಾಯ್ಡ್ SDK ಬಳಸುವಂತೆ ಪಾತ್ ನೀಡುವುದು
        export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: JagadishArk-Android-APK
        path: bin/*.apk
